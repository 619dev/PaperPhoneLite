name: paperphone-lite
services:
  server:
    container_name: paperphone-lite-server
    image: ${SERVER_IMAGE:-facilisvelox/paperphone-lite-server:latest}
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-paperphonelite}
      DB_PASS: ${DB_PASS:?Set DB_PASS in .env}
      DB_NAME: ${DB_NAME:-paperphonelite}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASS: ${REDIS_PASS:?Set REDIS_PASS in .env}
      BARK_ALLOWED_HOSTS: ${BARK_ALLOWED_HOSTS:-api.day.app}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      UPLOAD_DIR: /var/lib/paperphone-lite/uploads
    volumes:
      - uploads:/var/lib/paperphone-lite/uploads
    expose: ["3000"]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: unless-stopped
  tor:
    container_name: paperphone-lite-tor
    image: ${TOR_IMAGE:-facilisvelox/paperphone-lite-tor:latest}
    volumes:
      - tor_hidden_service:/var/lib/tor/paperphone-lite
      - ./logs:/var/log/paperphone-lite
    depends_on:
      server: { condition: service_healthy }
    restart: unless-stopped
  mysql:
    container_name: paperphone-lite-mysql
    image: mysql:8.0
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:-paperphonelite}
      MYSQL_USER: ${DB_USER:-paperphonelite}
      MYSQL_PASSWORD: ${DB_PASS:?Set DB_PASS in .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
  redis:
    container_name: paperphone-lite-redis
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASS:?Set REDIS_PASS in .env}"]
    environment:
      REDIS_PASS: ${REDIS_PASS:?Set REDIS_PASS in .env}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASS\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  mysql_data:
  redis_data:
  uploads:
  tor_hidden_service:
